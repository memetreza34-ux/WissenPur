name: WissenPur quality checks

on:
  pull_request:
    paths:
      - 'wissenpur/**'
      - '.github/workflows/wissenpur-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'wissenpur/**'
      - '.github/workflows/wissenpur-quality.yml'

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wissenpur

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wissenpur/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build production bundle
        env:
          GEMINI_API_KEY: ci-placeholder-key
        run: npm run build
